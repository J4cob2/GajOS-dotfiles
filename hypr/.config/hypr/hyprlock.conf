general {
    hide_cursor = true
}

background {
    monitor =
    path = screenshot        # rozmyty zrzut ekranu; albo ścieżka do obrazka
    blur_passes = 3
    blur_size = 7
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3
    dots_size = 0.25
    dots_spacing = 0.3
    inner_color = rgba(0, 0, 0, 0.4)
    outer_color = rgba(255, 255, 255, 0.8)
    font_color = rgb(255, 255, 255)
    fade_on_empty = true
    placeholder_text = <i>Hasło...</i>
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 64
    color = rgba(255, 255, 255, 0.9)
    position = 0, 120
    halign = center
    valign = center
}
